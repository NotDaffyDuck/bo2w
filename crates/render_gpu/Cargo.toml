[package]
name = "render_gpu"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Bevy render-world side: GPU buffers, pipelines and passes for the BO2 frame."

[dependencies]
bevy.workspace = true
bytemuck = { version = "1", features = ["derive"] }
hud = { path = "../hud" }

# Asset and world data.
assets.workspace = true
asset_core.workspace = true
asset_material.workspace = true
asset_t6.workspace = true
asset_world.workspace = true

# Rendering.
d3d9_sm3.workspace = true
d3d9_state.workspace = true
frame.workspace = true
render_frame.workspace = true
render_material.workspace = true

# Game-facing data the passes read.
diag.workspace = true
dpvs_t6.workspace = true
fx_t6.workspace = true
hud_t6.workspace = true
lighting_t6.workspace = true
perf.workspace = true

[dev-dependencies]
# Builds each world shader variant as Bevy does, in a test.
naga_oil = { version = "0.22", default-features = false, features = ["test_shader"] }

[lints]
workspace = true
