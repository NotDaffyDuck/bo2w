[package]
name = "render_frontend"
description = "Per-frame draw construction for the renderer: draw-surface packing, worker-command rings and scene occupancy."
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Engine and math.
bevy.workspace = true
bytemuck = { version = "1", features = ["derive"] }
game_math.workspace = true
perf.workspace = true
diag.workspace = true
frame.workspace = true
net.workspace = true
sim.workspace = true

# Asset loading.
assets.workspace = true
asset_core.workspace = true
asset_transport.workspace = true
asset_audio.workspace = true
asset_game.workspace = true
asset_material.workspace = true
asset_model.workspace = true
asset_t6.workspace = true
asset_world.workspace = true

# Game-side state the frontend reads.
audio.workspace = true
entity_t6.workspace = true
playerstate_t6.workspace = true
weapon_t6.workspace = true
hud_t6.workspace = true
xmodel_runtime.workspace = true

# Effects, lighting and scene visibility.
d3d9_state.workspace = true
dpvs_t6.workspace = true
fx.workspace = true
fx_t6.workspace = true
glass_t6.workspace = true
lighting_t6.workspace = true
marks_t6.workspace = true

# Render crates it builds on.
render_anim.workspace = true
render_frame.workspace = true
render_fx.workspace = true
render_material.workspace = true
render_scene.workspace = true
