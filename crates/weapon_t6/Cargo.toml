[package]
name = "weapon_t6"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "BO2 (T6) weapon brain: BO2's weapon states, per-weapon player data and PM_Weapon tick order, rebuilt in Rust from facts."

[dependencies]
fastfile_t6.workspace = true
frame.workspace = true
game_math.workspace = true
libm = { version = "0.2.16", default-features = false }

[[bin]]
name = "gun_trace"
path = "src/bin/gun_trace.rs"

[[bin]]
name = "vm_trace"
path = "src/bin/vm_trace.rs"

[lints]
workspace = true
