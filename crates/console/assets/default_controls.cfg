// Default controls — bind-id names follow the retail bind table.
// Black Ops II's own PC keys (its default_mp_controls.cfg), each bind we
// have a command for; Q/E lean and T/Y/Z chat and voice are not in ours.
// Edit and re-run `binddefaults`, or paste lines into the console.

bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
bind SPACE +gostand
bind C +stance
bind CTRL toggleprone
bind SHIFT +breath_sprint

bind MOUSE1 +attack
bind MOUSE2 +toggleads_throw
bind MOUSE3 +frag
bind MWHEELUP weapnext
bind MWHEELDOWN weapprev

bind R +reload
bind V +melee
bind F +activate
bind G +frag
bind 4 +smoke
bind TAB +scores

bind 1 +actionslot 1
bind 2 +actionslot 2
bind 3 +actionslot 4
bind 5 +actionslot 3
