// What a new player's keyboard and mouse do: Black Ops II's PC defaults.
// A key whose command is not in the game yet has no line here (lean on E and
// Q, the class hotkey, screenshot, pause). `binddefaults` puts these back.

// Moving
bind W +forward
bind S +back
bind A +moveleft
bind D +moveright
bind SPACE +gostand
bind C +stance
bind CTRL toggleprone
bind SHIFT +breath_sprint

// Mouse
bind MOUSE1 +attack
// BO2 binds aim-down-sights to a held button. Our +toggleads_throw flips on
// each press, so the held aim is +speed_throw.
bind MOUSE2 +speed_throw
bind MOUSE3 +frag
bind MWHEELUP +weapnext_inventory
bind MWHEELDOWN weapprev

// Using things
bind F +activate
bind G +frag
bind R +reload
bind V +melee
bind 4 +smoke
bind TAB +scores

// Killstreak slots
bind 3 +actionslot 4
bind 5 +actionslot 3

// Talking
bind T chatmodepublic
bind Y chatmodeteam
bind Z +talk
