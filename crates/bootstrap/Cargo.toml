[package]
name = "bootstrap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Composition root: reads the command line and builds the bevy App for a menu, map, serve or play run."

[features]
# Bevy's debug aids, with the source location of every system.
bevy-debug = ["bevy/debug", "bevy/track_location"]
# Bevy's own tracing spans as a Chrome trace beside the binary. Never in a
# timed run: the subscriber costs the frame it measures. It is the one way to
# see inside bevy's render graph, such as the span around the queue submit.
bevy-trace = ["bevy/trace", "bevy/trace_chrome"]
# The same spans added up by name into a small text file (src/span_stats.rs),
# which stays small over a whole match where a Chrome trace would not.
span-stats = ["bevy/trace", "bevy/debug"]

[dependencies]
asset_audio.workspace = true
asset_core.workspace = true
asset_game.workspace = true
asset_transport.workspace = true
assets.workspace = true
audio.workspace = true
bevy.workspace = true
bots.workspace = true
console.workspace = true
diag.workspace = true
frame.workspace = true
hud.workspace = true
master_protocol.workspace = true
net.workspace = true
render.workspace = true
render_frontend.workspace = true
replay.workspace = true
session.workspace = true
sim.workspace = true
ui.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true
