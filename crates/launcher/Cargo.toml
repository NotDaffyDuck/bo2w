[package]
name = "launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The bo2mp executable: the process entry point (allocator, command line, environment, log) around bootstrap."

[[bin]]
name = "bo2mp"
path = "src/main.rs"

[features]
bevy-debug = ["bootstrap/bevy-debug"]
bevy-trace = ["bootstrap/bevy-trace"]
span-stats = ["bootstrap/span-stats"]

[dependencies]
diag.workspace = true
asset_transport.workspace = true
bootstrap = { path = "../bootstrap" }

[lints]
workspace = true
