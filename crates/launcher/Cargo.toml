[package]
name = "launcher" # `cargo run -p launcher` builds bo2mp.exe from src/bin/bo2mp.rs
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "bo2mp.exe: process set-up (heap, current folder, log, flags, game folder), then bootstrap runs the game."

[features]
bevy-debug = ["bootstrap/bevy-debug"] # forwarded to bootstrap
bevy-trace = ["bootstrap/bevy-trace"]
span-stats = ["bootstrap/span-stats"]

[dependencies]
asset_transport = { workspace = true }
bootstrap.path = "../bootstrap"
diag = { workspace = true }

[lints]
workspace = true
