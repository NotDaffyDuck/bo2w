package.name = "updater"
package.version = "0.1.0"
package.edition.workspace = true
package.publish.workspace = true
package.description = "bo2mp-launcher: on request fetches a release over HTTPS (pinned CA), checks every hash, then starts bo2mp.exe."

[[bin]]
name = "bo2mp-launcher"
path = "src/main.rs"

[dependencies]
dotenvy.workspace = true
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zstd = { version = "0.13", default-features = false }

[lints]
workspace = true
