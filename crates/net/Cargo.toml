[package]
name = "net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Our wire: frames, deltas, prediction, interpolation. Not retail's netcode."

[dependencies]
diag.workspace = true
game_math.workspace = true
frame.workspace = true
playerstate_t6.workspace = true
entity_t6.workspace = true
xmodel_runtime.workspace = true
movement_t6.workspace = true
input_t6.workspace = true
weapon_t6.workspace = true
gamemode_t6.workspace = true
killcam_t6.workspace = true
sim.workspace = true
glass_t6.workspace = true # bo2mp: BO2 glass in the snapshot
hud_t6.workspace = true
perf.workspace = true
bevy.workspace = true
master_protocol.workspace = true
quinn = { version = "0.11.11", default-features = false, features = ["platform-verifier", "runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
rustls-platform-verifier = "0.7.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
zstd = { version = "0.13", default-features = false }

