# The bo2mp workspace: the game, its server and the tools that build and ship them.

[workspace]
resolver = "3"
# Built on its own through the patch below, not as a member.
exclude = ["third_party/wgpu-hal"]
# Every directory under crates/ holds one crate of the workspace (the 68 there on 10-27
# were exactly the old hand-kept list); xtask is the build runner.
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
publish = false

# Third-party crates, then the workspace's own, both alphabetical.
[workspace.dependencies]
async-lock = "3"
bcdec_rs = "0.2"
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset",
    "bevy_audio",
    "bevy_core_pipeline",
    "bevy_gilrs",
    "bevy_log",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_ui_widgets",
    "bevy_window",
    "bevy_winit",
    "multi_threaded",
    "png",
    "system_clipboard",
    "ui_picking",
    "wayland",
    "x11",
] }
bevy_ecs = "0.19"
dotenvy = "0.15"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
glam = "0.32.1"
miniz_oxide = "0.8"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "6", default-features = false, features = ["deflate"] }

anim_t6 = { path = "crates/anim_t6" }
anim_bank = { path = "crates/asset_anim" }
asset_audio = { path = "crates/asset_audio" }
asset_core = { path = "crates/asset_core" }
asset_game = { path = "crates/asset_game" }
asset_material = { path = "crates/asset_material" }
asset_model = { path = "crates/asset_model" }
asset_source = { path = "crates/asset_source" }
asset_t6 = { path = "crates/asset_t6" }
asset_transport = { path = "crates/asset_transport" }
asset_world = { path = "crates/asset_world" }
assets = { path = "crates/assets" }
audio = { path = "crates/audio" }
bo2_profile = { path = "crates/bo2_profile" }
bots = { path = "crates/bots" }
clipmap_t6 = { path = "crates/clipmap_t6" }
console = { path = "crates/console" }
d3d9_decl = { path = "crates/d3d9_decl" }
d3d9_sm3 = { path = "crates/d3d9_sm3" }
d3d9_state = { path = "crates/d3d9_state" }
