# An upstream bug worked around until a release carries the fix.
#
# wgpu-hal 29.0.4 and 30.0.1 report a swap-chain image that takes longer than a
# second to come back from the presentation engine as a lost device, which
# ends the game. third_party/wgpu-hal is the crates.io 29.0.4 with
# third_party/wgpu-hal-patch/acquire-wait.diff on top, which waits again
# instead; run `python third_party/wgpu-hal-patch/prepare.py` once after a clone
# to write it. Drop them once an upstream release stops turning that VK_TIMEOUT
# into DeviceError::Unexpected.
[patch.crates-io]
wgpu-hal = { path = "third_party/wgpu-hal" }
# bo2mp: a master bus with a meter and a limiter between every sound and the
# device (third_party/bevy_audio/src/master_bus.rs); the rest is crates.io 0.19.1.
bevy_audio = { path = "third_party/bevy_audio" }

[workspace.lints.clippy]
# Constants taken from the retail game are written at the precision they were
# read: the f32 value 0.0005882352706976235 is the exact one in the image, and
# shortening it to "enough digits" would silently change the physics.
excessive_precision = "allow"
# For the same reason a literal is never swapped for a std constant such as
# PI: the two can differ in the last bit of the f32.
approx_constant = "allow"
assertions_on_constants = "deny"

# Fat LTO and one codegen unit live on this profile only. The live recipes
# (`make map`, `play`, `bench`, `bench-live`, ...) and the default `make deploy`
# build `play` instead; `PROFILE=release` selects this one, for when a number
# has to match the LTO binary.
# Measured: wall p50 -5.7% and the binary 183 MB -> 114 MB. Do not change
# `lto` or `codegen-units` without a new A/B on two maps with the same
# protocol.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# What the dev loop builds: `make play`, `make bench`, and the default Windows
# and master deploy. It keeps release's opt-level (Bevy is too slow without it)
# and gives up the two settings whose cost lands at link time. Fat LTO over
# the whole dependency graph in one codegen unit is a single-threaded rustc
# at about 6.6 GB that reruns after an edit in any crate; that link took
# 13m03s and was what `make play` spent its time waiting on.
#
# `lto = false` still gets each crate's own thin LTO. Incremental builds pay
# off for recompiles after the first fill of this profile's cache. `strip` is
# set here, not in RUSTFLAGS, because RUSTFLAGS from the environment replace
# the target's flags and would give play and release different fingerprints.
#
# A separate profile, not a loosened release, so the binary the published
# numbers describe stays buildable. Play-versus-release frame time is not
# measured here: `make bench <demo>` against `make bench <demo> PROFILE=release`
# does that.
[profile.play]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
incremental = true
strip = "symbols"

# The binary a sampling profiler can read (`make bench-perf`). It is play with
# the same opt-level and codegen-units, so the frame times it samples are the
# ones `make bench-live` reports, plus the two things a profiler needs and
# release drops: line tables (`debug = 1`) to name a frame, and a frame
# pointer in every function (`-Cforce-frame-pointers=yes`, set by the recipe)
# so `--call-graph fp` can walk the stack. Strip is off to keep the line
# tables. Its own profile directory leaves play's and release's caches alone,
# so switching between bench and perf does not relink.
[profile.perf]
inherits = "play"
debug = 1
strip = "none"
